name: Kernel Build (CI)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  NUM_JOBS: 4

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: ["arm64", "arm"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Install toolchain
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        TOOLCHAIN_PKG=$(TARGET=${{ matrix.target }} ./build-local.sh toolchain-pkg)
        sudo apt-get update && sudo apt-get install -y "$TOOLCHAIN_PKG" build-essential bc bison flex libssl-dev
      timeout-minutes: 5

    - name: Build kernel
      id: build
      run: |
        TARGET=${{ matrix.target }} JOBS=${{ env.NUM_JOBS }} ./build-local.sh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ steps.build.outputs.name }}-${{ steps.build.outputs.short_sha }}
        path: |
          ${{ github.workspace }}/kernel-${{ steps.build.outputs.name }}-*.tar.gz
          ${{ github.workspace }}/kernel-${{ steps.build.outputs.name }}-*.sha256
          ${{ github.workspace }}/build/${{ matrix.target }}/.config
        retention-days: 30
