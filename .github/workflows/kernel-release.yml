name: Kernel Release

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:

env:
  NUM_JOBS: 4

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: ["arm64", "arm"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Install toolchain
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        TOOLCHAIN_PKG=$(TARGET=${{ matrix.target }} ./build-local.sh toolchain-pkg)
        sudo apt-get update && sudo apt-get install -y "$TOOLCHAIN_PKG" build-essential bc bison flex libssl-dev dpkg-dev fakeroot rsync kmod cpio
      timeout-minutes: 5

    - name: Build kernel
      id: build
      run: |
        TARGET=${{ matrix.target }} JOBS=${{ env.NUM_JOBS }} ./build-local.sh deb

    - name: Upload release artifacts
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{ github.workspace }}/kernel-${{ steps.build.outputs.name }}-*.tar.gz
          ${{ github.workspace }}/kernel-${{ steps.build.outputs.name }}-*.sha256
          ${{ github.workspace }}/build/linux-image-*.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Save config artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.name }}_config-${{ steps.build.outputs.short_sha }}
        path: ${{ github.workspace }}/build/${{ matrix.target }}/.config
        retention-days: 30
